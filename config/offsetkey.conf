# ===================== Bluetooth parameter configuration =====================
# Maximum connection interval (1.25ms unit, 9=11.25ms)
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# Connection latency (number of connection events skipped by the host)
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
# Acl packet send buffer number
CONFIG_BT_BUF_ACL_TX_COUNT=32
# Number of L2 cap layer send buffers
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
# Bluetooth transmit power +8d bm (maximum)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Enable Bluetooth battery service 
CONFIG_BT_BAS=y

# ===================== Automatic sleep related =====================
# Automatic sleep
CONFIG_ZMK_SLEEP=y
# (Annotated) Time to enter automatic sleep (unit: ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
#Time to enter idle state (unit: ms)
CONFIG_ZMK_IDLE_TIMEOUT=15000

# ===================== BLE Experimental Features =====================
# Enable BLE experimental connection features
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# The master terminal obtains the battery power of the slave terminal
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Host agent battery level
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Behavior queue size to improve macro/key combination responsiveness
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# ===================== Display related =====================
# Enable display support
CONFIG_ZMK_DISPLAY=y

# Hide screen when keyboard is idle
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ===================== SPI and input devices =====================
# Enable SPI bus support
CONFIG_SPI=y
# Enable input device support
CONFIG_INPUT=y
# Enable external power supply detection
CONFIG_ZMK_EXT_POWER=y

# ===================== Electronic control related =====================
# Please do not modify the following parameters. They are used to power some peripherals of the keyboard and have nothing to do with the RGB backlight.
CONFIG_ZMK_BACKLIGHT=y
# The backlight brightness is 100 when turned on.
CONFIG_ZMK_BACKLIGHT_BRT_START=100
# Automatically turn on backlight when booting
CONFIG_ZMK_BACKLIGHT_ON_START=y
# Automatically turn off backlight when idle
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n
#The maximum brightness percentage of RGB，Reducing this value can lower the temperature of the rectifier components.(RGB的最大百分比亮度，降低可以减少发热）
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=70



# ===================== Pin control =====================
# enable pin control
CONFIG_PINCTRL=y

# ===================== Pointing device (mouse) related =====================
# Enable pointing device support
CONFIG_ZMK_POINTING=y
# Enable smooth scrolling
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

# ===================== USB Log =====================
# Enable USB log output
CONFIG_ZMK_USB_LOGGING=n

# ===================== RGB light strip related =====================
# Enable WS2812 light strip support
CONFIG_WS2812_STRIP=y
# enable rgb bottom light
CONFIG_ZMK_RGB_UNDERGLOW=y
# Automatically turn on rgb bottom light when booting
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# Automatically turn off rgb bottom light when idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Rgb bottom light initial hue (green series)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
# RGB bottom light initial special effect (No. 3 special effect)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
#RGB switch can control output power simultaneously
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y



# ========== Other options (uncomment if necessary) ==========
# Automatically turn off RGB lights when USB connection is disconnected
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
#The anti-shake time can be shortened appropriately if low latency is pursued, and extended appropriately if a combo occurs.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=6
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=4

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_GPIO=y

